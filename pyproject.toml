[project]
name = "trade-graph"
version = "0.1.0"
description = "Cost-aware autonomous paper-trading organisation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16",
  "fastapi>=0.116",
  "httpx>=0.28",
  "jinja2>=3.1",
  "langgraph>=0.6",
  "langgraph-checkpoint-sqlite>=2.0",
  "pydantic>=2.11",
  "sqlalchemy>=2.0",
  "uvicorn>=0.35",
]

[dependency-groups]
dev = [
  "hypothesis>=6.135",
  "pytest>=8.4",
  "ruff>=0.12",
]

[project.scripts]
trade-graph = "trade_graph.cli:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["I", "E", "F"]
