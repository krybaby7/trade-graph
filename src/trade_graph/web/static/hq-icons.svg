<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Trade Graph HQ icons. Decorative only: every icon sits next to a text label. -->
  <!-- Rooms (24 x 24, stroked with the current text colour). -->
  <symbol id="leader" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.5 21V3.5"/>
    <path d="M5.5 4.5h11.5l-2.4 4 2.4 4H5.5"/>
  </symbol>
  <symbol id="research" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 3h6"/>
    <path d="M10 3v6.2L4.8 18.1A2 2 0 0 0 6.5 21h11a2 2 0 0 0 1.7-2.9L14 9.2V3"/>
    <path d="M7.4 14.5h9.2"/>
  </symbol>
  <symbol id="trader" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 3v4M7 16v5M17 3v7M17 17v4"/>
    <rect x="4.8" y="7" width="4.4" height="9" rx="1"/>
    <rect x="14.8" y="10" width="4.4" height="7" rx="1"/>
  </symbol>
  <symbol id="learning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 5.6c2.6-1 6-1 9 1 3-2 6.4-2 9-1v13.2c-2.6-1-6-1-9 1-3-2-6.4-2-9-1z"/>
    <path d="M12 6.6v13.2"/>
  </symbol>
  <symbol id="optimisation" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.8 17.5a8.2 8.2 0 1 1 16.4 0"/>
    <path d="M12 17.5l4.2-5.2"/>
    <circle cx="12" cy="17.5" r="1.3"/>
    <path d="M7.2 11.6l-1-.8M12 9.3V8M16.8 11.6l1-.8"/>
  </symbol>
  <symbol id="engineer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.7 6.3a4 4 0 0 0-5.2 5.2L4 17l3 3 5.5-5.5a4 4 0 0 0 5.2-5.2l-2.6 2.6-2.5-.5-.5-2.5z"/>
  </symbol>
  <symbol id="secretary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2"/>
    <path d="M3.6 6.6 12 13l8.4-6.4"/>
  </symbol>
  <symbol id="market" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12.5h3.8l2.4-6 4.2 11 2.4-5H21"/>
  </symbol>
  <symbol id="accounts" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="3" width="14" height="18" rx="2"/>
    <path d="M8.5 7.5h7"/>
    <path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01M8.5 15h.01M12 15h.01M15.5 15h.01M8.5 18h7"/>
  </symbol>

  <!-- Lights (16 x 16). Shape always carries the meaning; colour only adds to it. -->
  <symbol id="light-working" viewBox="0 0 16 16" fill="currentColor">
    <circle cx="8" cy="8" r="5.5"/>
  </symbol>
  <symbol id="light-waiting" viewBox="0 0 16 16" fill="currentColor">
    <circle cx="8" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="M8 3a5 5 0 0 1 0 10z"/>
  </symbol>
  <symbol id="light-resting" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9">
    <circle cx="8" cy="8" r="5"/>
  </symbol>
  <symbol id="light-ok" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9">
    <circle cx="8" cy="8" r="5"/>
  </symbol>
  <symbol id="light-paused" viewBox="0 0 16 16" fill="currentColor">
    <rect x="4" y="3" width="2.7" height="10" rx="1"/>
    <rect x="9.3" y="3" width="2.7" height="10" rx="1"/>
  </symbol>
  <symbol id="light-on_call" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="8" cy="8" r="5" stroke-dasharray="0.6 2.6"/>
  </symbol>
  <symbol id="light-stuck" viewBox="0 0 16 16" fill="currentColor">
    <path d="M8 2.2 14.4 13.4H1.6z"/>
  </symbol>
  <symbol id="light-attention" viewBox="0 0 16 16" fill="currentColor">
    <path d="M8 2.2 14.4 13.4H1.6z"/>
  </symbol>
  <symbol id="light-off" viewBox="0 0 16 16" fill="currentColor">
    <rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/>
  </symbol>

  <!-- Needs-you severity marks (16 x 16). -->
  <symbol id="sev-act" viewBox="0 0 16 16" fill="currentColor">
    <path d="M8 1.6 14.4 8 8 14.4 1.6 8z"/>
  </symbol>
  <symbol id="sev-watch" viewBox="0 0 16 16" fill="currentColor">
    <path d="M8 2.2 14.4 13.4H1.6z"/>
  </symbol>
  <symbol id="sev-info" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="8" cy="8" r="5.6"/>
    <path d="M8 7.4v3.4M8 5.2h.01"/>
  </symbol>

  <!-- Section tabs (24 x 24). -->
  <symbol id="tab-hq" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 10.5 12 4l8.5 6.5"/>
    <path d="M5.5 9v11h13V9"/>
    <path d="M10 20v-5.5h4V20"/>
  </symbol>
  <symbol id="tab-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5" width="17" height="15" rx="2"/>
    <path d="M3.5 9.5h17M8 3v4M16 3v4"/>
    <path d="M7.5 13h.01M12 13h.01M16.5 13h.01M7.5 16.5h.01M12 16.5h.01"/>
  </symbol>
  <symbol id="tab-story" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="1.6"/>
    <circle cx="6" cy="12" r="1.6"/>
    <circle cx="6" cy="18" r="1.6"/>
    <path d="M10 6h10M10 12h10M10 18h7"/>
  </symbol>
  <symbol id="tab-money" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="9" cy="7" rx="5.5" ry="2.5"/>
    <path d="M3.5 7v4c0 1.4 2.5 2.5 5.5 2.5s5.5-1.1 5.5-2.5V7"/>
    <path d="M9.5 16.4c.9 2 3.1 3.1 5.5 3.1 3 0 5.5-1.1 5.5-2.5v-6c0-1.2-1.8-2.2-4.3-2.4"/>
    <path d="M14.5 13.5c1.2.9 3.6 1.2 6 .3"/>
  </symbol>
  <symbol id="tab-decide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/>
    <circle cx="15" cy="7" r="2"/>
    <circle cx="9" cy="17" r="2"/>
  </symbol>

  <!-- Small controls (16 x 16). -->
  <symbol id="close" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M4 4l8 8M12 4l-8 8"/>
  </symbol>
  <symbol id="copy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
    <rect x="5.5" y="5.5" width="8" height="8.5" rx="1.5"/>
    <path d="M10.5 5.5V3.5A1.5 1.5 0 0 0 9 2H3.5A1.5 1.5 0 0 0 2 3.5V9A1.5 1.5 0 0 0 3.5 10.5h2"/>
  </symbol>
  <symbol id="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3.5 10.5 8 6 12.5"/>
  </symbol>
  <symbol id="plus" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <path d="M8 3v10M3 8h10"/>
  </symbol>
  <symbol id="you" viewBox="0 0 16 16" fill="currentColor">
    <path d="M8 1.6 14.4 8 8 14.4 1.6 8z"/>
  </symbol>
  <symbol id="hq" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 10.5 12 4l8.5 6.5"/>
    <path d="M5.5 9v11h13V9"/>
  </symbol>
</svg>
