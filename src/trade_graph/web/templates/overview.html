<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade Graph</title>
  <style>
    body { font-family: sans-serif; margin: 1.5rem; }
    .label { color: #444; }
  </style>
</head>
<body>
  <p><a href="/organization">Organisation</a> <a href="/costs">Costs</a> <a href="/changes">Changes</a></p>
  <h1>Overview</h1>
  <p class="label">Simulated paper equity ({{ currency }}). This is not actual operating spend.</p>
  <p id="equity">{{ equity }}</p>
  <p class="label">Provisional</p>
  <p id="provisional">{{ provisional }}</p>
  <p class="label">Actual operating spend</p>
  <p id="spend">{{ spend }}</p>
</body>
</html>
